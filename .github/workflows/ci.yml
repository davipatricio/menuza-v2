name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Cache path covers the Bun install cache plus every workspace's node_modules
# (Bun hoists into the root but also installs per-workspace .bin links).
defaults:
  cache:
    path: |
      ~/.bun/install/cache
      node_modules
      apps/*/node_modules
      packages/*/node_modules
    key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
    restore-keys: |
      bun-${{ runner.os }}-

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: No manifest drift
        run: |
          test -z "$(git status --porcelain package.json bun.lock apps/*/package.json packages/*/package.json)" \
            || (echo "manifest drift detected"; git status --porcelain; exit 1)

  policy:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Frozen install (fallback if cache miss)
        run: bun install --frozen-lockfile
      - name: Workspace policy
        run: bun test scripts/workspace-policy.test.ts

  typecheck:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Frozen install (fallback if cache miss)
        run: bun install --frozen-lockfile
      - name: Prisma generate
        run: bun run db:generate
      - name: Next types
        run: bun run typegen
      - name: TypeScript 7 check
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Frozen install (fallback if cache miss)
        run: bun install --frozen-lockfile
      - name: Unit tests (no infra)
        run: bun test

  lint:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Frozen install (fallback if cache miss)
        run: bun install --frozen-lockfile
      - name: Oxlint
        run: bun run lint

  fmt:check:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Frozen install (fallback if cache miss)
        run: bun install --frozen-lockfile
      - name: Oxfmt check
        run: bun run fmt:check

  build:
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Frozen install (fallback if cache miss)
        run: bun install --frozen-lockfile
      - name: Prisma generate
        run: bun run db:generate
      - name: Next build (type checking enabled)
        run: bun run build
        env:
          # Empty secrets disable source map upload; see apps/web/next.config.ts.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      - name: Compile Bun services
        run: |
          bun run --filter '@menuza/commerce' build
          bun run --filter '@menuza/tenant' build
          bun run --filter '@menuza/worker' build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: apps/web/.next
          retention-days: 1
