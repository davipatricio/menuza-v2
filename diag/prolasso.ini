# prolasso.ini — Process Lasso Configuration
# Generated from bitsum.com official documentation
# AMD Ryzen 5 5500U (6C/12T) optimization profile
#
# INSTALLATION: Copy to %APPDATA%\Bitsum\Process Lasso\prolasso.ini
# OR: ProcessGovernor.exe /ConfigFolder="C:\ProgramData\Bitsum\Process Lasso"
#
# For new installs, use the installer:
#   ProcessLassoSetup.exe /S /configfolder=C:\pl_config /importconfigfrom=C:\path\to\prolasso.ini
#
# After saving, restart Process Lasso or run:
#   ProcessLasso.exe /ConfigFolder="%APPDATA%\Bitsum\Process Lasso" /TrimNow

# ===== OutOfControl Process Restraint =====
# Prevents runaway processes from consuming all CPU
[OutOfControlProcessRestraint]
OocOn=True
TotalProcessorUsageBeforeRestraint=85
PerProcessUsageBeforeRestraint=20
TimeOverQuotaBeforeRestraint=2800
PerProcessUsageForRestore=10
TameOnlyNormal=True
LowerToIdleInsteadOfBelowNormal=False
ExcludeServices=False
ExcludeForegroundProcesses=True
DoNotLowerPriorityClass=False
OocExclusions=

# ===== GUI Settings =====
[GUI]
HideGraph=False
HideProcessIcons=False
ShowGraphLegend=True
ClearLogAtExit=False

# ===== Performance Settings =====
[Performance]
ManageOnlyCurrentUser=True
ExitOnCloseWindow=False
BoostForegroundThread=True
BoostForegroundProcess=True
SoundsOff=True
AggressivelyTrimProcessLassoWorkingSet=True
CloseApplicationTimeoutSeconds=10
ForcedMode=False

# ===== Updates =====
[Updates]
CheckForUpdates=False

# ===== System Tray Icon =====
[SystemTrayIcon]
UseStaticIcon=False
ShowResponsivnessInTrayInsteadOfProcessorUsage=False

# ===== Logging =====
[Logging]
LogAllProcessesExecuted=False
LogProcessesDisallowed=True
LogDefaultPriorityAdjustments=True
LogDefaultAffinityAdjustments=True
LogOutOfControlProcessesRestrained=True
LogOutOfControlProcessesRestored=True
LogInstanceLimitTerminations=True
MaximumLogEntries=50

# ===== Memory Management =====
[MemoryManagement]
TrimAllProcessesAtThisIntervalInMs=30000

# ===== SysTray Balloons =====
[SysTrayBalloons]
ShowBalloons=False
BalloonTipDuration=10000
ShowBalloonsForOocPriorityRestoration=False

# ===== Performance (second section) =====
[Performance]
UpdateSpeed=1000

# ===== Process Allowances =====
[ProcessAllowances]
AllowedProcesses=
DisallowedProcesses=
InstanceLimitedProcesses=
MatchDisallowedWildcardsToPathnames=False

# ===== Process Defaults =====
# Format: process1,priority1;process2,priority2;process3,priority3
# Valid priorities: Real time, High, Above normal, Normal, Below normal, Idle
# Wildcards allowed: *.exe, process*
#
# CPU Affinity bitmasks (decimal):
#   0xFF = cores 0-7 (first 8 cores)
#   0xFFF = cores 0-11 (all 12 logical processors)
#   0x1 = core 0 only
#   0x5 = cores 0 and 2 (alternating for SMT)
#
# For AMD Ryzen 5500U (6C/12T):
#   Use bitmask 4095 (0xFFF) for all 12 logical cores
#
# Brave: 24 instances - above normal priority, all cores
# Orca: 7 instances - above normal priority, all cores
# opencode: 2 instances - above normal priority, all cores
# Explorer: system stability - normal, all cores
# System processes: normal, all cores
[ProcessDefaults]
DefaultPriorities=brave.exe,above normal;Orca.exe,above normal;opencode2.exe,above normal;explorer.exe,normal;System.exe,normal;svchost.exe,normal;csrss.exe,normal;lsass.exe,normal;dwm.exe,normal;textinputhost.exe,normal;StartMenuExperienceHost.exe,normal;SecurityHealthSystray.exe,normal
DefaultAffinities=brave.exe,4095;Orca.exe,4095;opencode2.exe,4095;explorer.exe,4095;System.exe,4095;svchost.exe,4095;csrss.exe,4095;lsass.exe,4095;dwm.exe,4095
MatchWildcardsToPathnames=False

# ===== Advanced Rules =====
[AdvancedRules]
WatchdogRules=

# ===== Process Allowances =====
[ProcessAllowances]
AllowedProcesses=brave.exe;Orca.exe;opencode2.exe;explorer.exe;System.exe
DisallowedProcesses=
InstanceLimitedProcesses=
MatchDisallowedWildcardsToPathnames=False
