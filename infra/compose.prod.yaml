# Production stack for Menuza's stateful infrastructure.
#
#   POSTGRES_USER=... POSTGRES_PASSWORD=... POSTGRES_DB=... REDIS_PASSWORD=... \
#     podman-compose -p menuza-prod -f infra/compose.prod.yaml up -d
#
# No host port is published: Postgres and Valkey are reachable only from other
# containers on this network, as `postgres:5432` and `redis:6379`.
# Every credential is required and fails fast when unset.
#
# App connection strings:
#   DATABASE_URL=postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB
#   REDIS_URL=redis://:$REDIS_PASSWORD@redis:6379
#
# Jaeger is intentionally absent: the all-in-one image keeps traces in memory
# and is dev-only. Point OTEL_EXPORTER_OTLP_ENDPOINT at a real collector.

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s

  redis:
    image: docker.io/valkey/valkey:9.1-alpine
    restart: always
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s

volumes:
  postgres-data:
    name: menuza-prod-postgres-data
  redis-data:
    name: menuza-prod-redis-data
