# Local-only foundation infrastructure.
# Podman Compose provider: podman-compose 1.3.0 (Linux/WSL2).
# Bring up via: bun run infra:up. Bring down via: bun run infra:down.
# Restart preserves data via named volumes. Volumes are NEVER removed by the down script.
services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    # Postgres 18 image uses PGDATA=/var/lib/postgresql/data (PG_MAJOR/PGDATA),
    # but podman-compose's named volume mounts must point at the default data path
    # for the image. We set PGDATA explicitly to make the mount location deterministic.
    container_name: menuza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: menuza
      POSTGRES_PASSWORD: menuza
      POSTGRES_DB: menuza
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menuza -d menuza"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7.4-alpine
    container_name: menuza-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Trace collector + UI for local development. Traces are in-memory only.
  # The API/worker OTLP HTTP exporter targets 4318; the UI is at
  # http://127.0.0.1:16686. Set OTEL_EXPORTER_OTLP_ENDPOINT to use it.
  jaeger:
    image: docker.io/jaegertracing/all-in-one:1.69.0
    container_name: menuza-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:4318:4318" # OTLP HTTP (exporter)
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:16686:16686" # UI

volumes:
  postgres-data:
  redis-data:
